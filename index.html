<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Mock Test (100 MCQ)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1, h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    
    /* Login & Config Screen */
    .login-box { max-width: 450px; margin: 30px auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fafafa; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
    .btn { display: block; width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .btn:hover { background: #219150; }
    .btn-secondary { background: #2980b9; }
    .btn-secondary:hover { background: #1f6391; }
    
    /* Timer & Header Info */
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: #ecf0f1; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .timer { font-size: 18px; font-weight: bold; color: #c0392b; }
    
    /* Question Card Styles */
    .question-card { margin-bottom: 25px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; }
    .question-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #1e293b; }
    .options-group { list-style: none; }
    .option-item { margin-bottom: 8px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; }
    .option-item:hover { background-color: #f1f5f9; }
    .option-item input[type="radio"] { margin-right: 12px; transform: scale(1.2); cursor: pointer; }
    
    /* Preview Colors */
    .correct-ans { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; font-weight: bold; }
    .wrong-ans { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; font-weight: bold; }
    .ans-status { margin-top: 10px; font-weight: bold; font-size: 14px; }

    /* Result Summary Screen */
    .summary-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; text-align: center; }
    .metric-box { padding: 15px; background: #fff; border-radius: 6px; border: 1px solid #cbd5e1; }
    .metric-box h3 { font-size: 22px; color: #0f172a; margin-top: 5px; }
    .metric-box p { font-size: 13px; color: #64748b; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Step 1: Login Form -->
  <div id="loginSection" class="login-box">
    <h2>Student Verification</h2>
    <form id="studentForm">
      <div class="form-group">
        <label for="studentName">Full Name</label>
        <input type="text" id="studentName" required placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label for="studentPhone">Phone Number</label>
        <input type="tel" id="studentPhone" required placeholder="Enter 10-digit mobile number">
      </div>
      <button type="submit" class="btn">Start Mock Test</button>
    </form>
  </div>

  <!-- Step 2: Test Dashboard -->
  <div id="testSection" class="hidden">
    <div class="header-bar">
      <div><strong>Candidate:</strong> <span id="displayName"></span></div>
      <div class="timer">Time Remaining: <span id="timerDisplay">90:00</span></div>
    </div>
    
    <form id="quizForm">
      <div id="questionsContainer"></div>
      <button type="button" onclick="submitExam()" class="btn" style="margin-top: 20px;">Submit Test</button>
    </form>
  </div>

  <!-- Step 3: Preview & Result Screen -->
  <div id="resultSection" class="hidden">
    <h2>Test Summary & Review</h2>
    
    <div class="summary-card">
      <div class="metric-box"><p>Total Score</p><h3 id="scoreVal">0</h3></div>
      <div class="metric-box"><p>Correct</p><h3 id="correctVal" style="color:#27ae60;">0</h3></div>
      <div class="metric-box"><p>Incorrect</p><h3 id="wrongVal" style="color:#c0392b;">0</h3></div>
      <div class="metric-box"><p>Unattempted</p><h3 id="skippedVal" style="color:#7f8c8d;">0</h3></div>
    </div>

    <button onclick="window.print()" class="btn btn-secondary" style="margin-bottom: 25px;">Download / Print Preview</button>
    
    <div id="previewContainer"></div>
  </div>

</div>

    { q: "কোনো দ্রব্যের দাম 25% বৃদ্ধি পেলে একই পরিমাণ টাকা খরচ রাখতে ভোগের পরিমাণ কত শতাংশ কমাতে হবে?", options: ["A) 15%", "B) 20%", "C) 25%", "D) 30%"], ans: "B" },
    { q: "একটি পরীক্ষায় পাশ নম্বর মোট নম্বরের 35%। একজন ছাত্র 210 নম্বর পেয়ে 35 নম্বরে ফেল করল। পরীক্ষার মোট নম্বর কত?", options: ["A) 600", "B) 650", "C) 700", "D) 750"], ans: "C" },
    { q: "A : B = 5 : 6 এবং B : C = 9 : 10 হলে A : B : C কত?", options: ["A) 5 : 6 : 10", "B) 15 : 18 : 20", "C) 10 : 18 : 20", "D) 15 : 20 : 18"], ans: "B" },
    { q: "A ₹50,000 দিয়ে 12 মাস এবং B ₹75,000 দিয়ে 8 মাস ব্যবসা করল। মূলধন × সময়ের ভিত্তিতে তাদের লাভের অনুপাত কত?", options: ["A) 1 : 1", "B) 2 : 3", "C) 3 : 2", "D) 4 : 5"], ans: "A" },
    { q: "A ₹60,000 দিয়ে 9 মাস, B ₹45,000 দিয়ে 12 মাস এবং C ₹30,000 দিয়ে 6 মাস ব্যবসা করল। মোট লাভ ₹49,000 হলে B-এর লাভের অংশ কত?", options: ["A) ₹14,000", "B) ₹18,000", "C) ₹21,000", "D) ₹24,000"], ans: "C" },
    { q: "₹8,750-এর উপর 8% বার্ষিক সরল সুদে 2 বছরে সুদ কত?", options: ["A) ₹1,200", "B) ₹1,300", "C) ₹1,400", "D) ₹1,500"], ans: "C" },
    { q: "₹5,000-এর উপর 10% বার্ষিক চক্রবৃদ্ধি সুদে 2 বছরে মোট চক্রবৃদ্ধি সুদ কত?", options: ["A) ₹1,000", "B) ₹1,050", "C) ₹1,100", "D) ₹1,150"], ans: "B" },
    { q: "₹10,000-এর উপর 10% বার্ষিক হারে 3 বছরে Compound Interest ও Simple Interest-এর পার্থক্য কত?", options: ["A) ₹300", "B) ₹331", "C) ₹341", "D) ₹360"], ans: "B" },
    { q: "8টি সংখ্যার গড় 42। প্রথম 5টি সংখ্যার গড় 38 এবং শেষ 4টি সংখ্যার গড় 46 হলে 5ম সংখ্যাটি কত?", options: ["A) 36", "B) 38", "C) 40", "D) 42"], ans: "B" },
    { q: "₹25/kg ও ₹45/kg দামের দুটি চাল কী অনুপাতে মেশালে মিশ্রণের দাম ₹33/kg হবে?", options: ["A) 2 : 3", "B) 3 : 2", "C) 4 : 3", "D) 5 : 3"], ans: "B" },
    { q: "একটি নৌকার স্থির জলে বেগ 15 km/h এবং স্রোতের বেগ 3 km/h। 72 km উজানে যেতে কত সময় লাগবে?", options: ["A) 4 ঘণ্টা", "B) 5 ঘণ্টা", "C) 6 ঘণ্টা", "D) 8 ঘণ্টা"], ans: "C" },
    { q: "2026 Commonwealth Games কোন শহরে অনুষ্ঠিত হয়েছিল?", options: ["A) Birmingham", "B) Glasgow", "C) Manchester", "D) Edinburgh"], ans: "B" },
    { q: "PM Surya Ghar: Muft Bijli Yojana মূলত কোন ক্ষেত্রকে উৎসাহিত করে?", options: ["A) Rooftop Solar", "B) Wind Energy", "C) Nuclear Energy", "D) Biofuel"], ans: "A" },
    { q: "পশ্চিমবঙ্গ সরকারের সংস্কৃতি দপ্তরের অধীন Paschimbanga Bangla Akademi কোন পুরস্কারগুলির একটি প্রদান করে?", options: ["A) Bankim Smriti Puraskar", "B) Arjuna Award", "C) Dronacharya Award", "D) Shanti Swarup Bhatnagar Award"], ans: "A" },
    { q: "2026 Commonwealth Games-এ অংশগ্রহণকারী পশ্চিমবঙ্গের gymnast Protisha Samanta-র উল্লেখযোগ্য পূর্ববর্তী সাফল্য কোনটি?", options: ["A) 2019 Khelo India Youth Games-এ তিনটি Gold", "B) 2020 Olympics-এ Gold", "C) 2022 Asian Games-এ Gold", "D) 2024 Olympics-এ Silver"], ans: "A" }
  ];

  let currentStudent = { name: '', phone: '' };
  let timerInterval;

  // Login Handling
  document.getElementById('studentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('studentName').value.trim();
    const phone = document.getElementById('studentPhone').value.trim();

    // Verification Logic
    if (!ALLOWED_NUMBERS.includes(phone)) {
      alert("Unauthorized! Your mobile number is not registered for this exam.");
      return;
    }

    let attempts = parseInt(localStorage.getItem('attempts_' + phone) || '0');
    if (attempts >= MAX_ATTEMPTS) {
      alert("Attempt limit reached! You have already attempted this exam 25 times.");
      return;
    }

    // Save Attempt
    localStorage.setItem('attempts_' + phone, attempts + 1);
    currentStudent = { name, phone };

    // Render Test UI
    document.getElementById('displayName').innerText = name;
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('testSection').classList.remove('hidden');

    renderQuestions();
    startTimer(90 * 60); // 90 minutes
  });

  // Render Questions inside form
  function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = rawQuestions.map((qObj, idx) => `
      <div class="question-card" id="qcard_${idx}">
        <div class="question-title">${idx + 1}. ${qObj.q}</div>
        <div class="options-group">
          ${qObj.options.map((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            return `
              <label class="option-item">
                <input type="radio" name="q_${idx}" value="${letter}">
                ${opt}
              </label>
            `;
          }).join('')}
        </div>
      </div>
    `).join('');
  }

  // Timer Implementation
  function startTimer(durationSeconds) {
    let timer = durationSeconds;
    const display = document.getElementById('timerDisplay');
    
    timerInterval = setInterval(() => {
      let minutes = parseInt(timer / 60, 10);
      let seconds = parseInt(timer % 60, 10);

      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;

      display.textContent = minutes + ":" + seconds;

      if (--timer < 0) {
        clearInterval(timerInterval);
        alert("Time is up! Submitting your exam automatically.");
        submitExam();
      }
    }, 1000);
  }

  // Exam Submission & Grading
  function submitExam() {
    clearInterval(timerInterval);
    
    let correct = 0;
    let wrong = 0;
    let skipped = 0;
    let totalScore = 0;

    rawQuestions.forEach((qObj, idx) => {
      const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
      if (selected) {
        if (selected.value === qObj.ans) {
          correct++;
          totalScore += 2;
        } else {
          wrong++;
          totalScore -= 0.5;
        }
      } else {
        skipped++;
      }
    });

    // Send Data to Google Sheets
    sendDataToGoogleSheets({
      name: currentStudent.name,
      phone: currentStudent.phone,
      score: totalScore,
      correct: correct,
      wrong: wrong,
      skipped: skipped,
      timestamp: new Date().toISOString()
    });

    // Update Result Summary
    document.getElementById('scoreVal').innerText = totalScore;
    document.getElementById('correctVal').innerText = correct;
    document.getElementById('wrongVal').innerText = wrong;
    document.getElementById('skippedVal').innerText = skipped;

    // Show Preview Mode
    showPreview();
    
    document.getElementById('testSection').classList.add('hidden');
    document.getElementById('resultSection').classList.remove('hidden');
  }

  // Render Preview Mode (Green for Correct, Red for Incorrect)
  function showPreview() {
    const previewContainer = document.getElementById('previewContainer');
    previewContainer.innerHTML = rawQuestions.map((qObj, idx) => {
      const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
      const userAns = selected ? selected.value : null;
      
      return `
        <div class="question-card">
          <div class="question-title">${idx + 1}. ${qObj.q}</div>
          <div class="options-group">
            ${qObj.options.map((opt, oIdx) => {
              const letter = String.fromCharCode(65 + oIdx);
              let cls = '';
              if (letter === qObj.ans) {
                cls = 'correct-ans';
              } else if (userAns === letter && userAns !== qObj.ans) {
                cls = 'wrong-ans';
              }
              return `<div class="option-item ${cls}">${opt}</div>`;
            }).join('')}
          </div>
          <div class="ans-status">
            ${userAns === null ? '<span style="color:#7f8c8d;">Status: Skipped</span>' : 
              userAns === qObj.ans ? '<span style="color:#27ae60;">Status: Correct (+2)</span>' : 
              '<span style="color:#c0392b;">Status: Wrong (-0.5)</span>'}
          </div>
        </div>
      `;
    }).join('');
  }

  // Multi-endpoint Google Sheets Web App Sync
  function sendDataToGoogleSheets(data) {
    GOOGLE_SHEET_URLS.forEach(url => {
      fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).catch(err => console.error("Sheet Sync Error:", err));
    });
  }
</script>
